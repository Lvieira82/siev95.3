{% extends 'base.html' %}

{% block title %}
Solicitar Correção
{% endblock %}

{% block content %}

<style>

.card{
    max-width:700px;
    margin:40px auto;
    background:#fff;
    padding:35px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

textarea{
    width:100%;
    min-height:180px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    resize:vertical;
    box-sizing:border-box;
}

.acoes{
    margin-top:25px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:12px 24px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    text-decoration:none;
    font-weight:bold;
}

.btn-enviar{
    background:#d97706;
    color:#fff;
}

.btn-voltar{
    background:#6b7280;
    color:#fff;
}

@media(max-width:768px){

    .card{
        margin:20px;
        padding:20px;
    }

    .acoes{
        flex-direction:column;
    }

    .btn{
        width:100%;
        text-align:center;
    }

}

</style>

<div class="card">

<h2>Solicitar Correção</h2>

<p>

<strong>Protocolo:</strong>

{{ solicitacao.protocolo }}

</p>

<p>

<strong>Evento:</strong>

{{ solicitacao.nome_evento }}

</p>

<form method="post">

{% csrf_token %}

<label>

Informe o motivo da correção

</label>

<textarea
name="motivo_correcao"
required
placeholder="Descreva exatamente o que deve ser corrigido..."></textarea>

<div class="acoes">

<button
type="submit"
class="btn btn-enviar">

Enviar Solicitação

</button>

<a
href="{% url 'listar_pendentes_opo' %}"
class="btn btn-voltar">

Cancelar

</a>

</div>

</form>

</div>

{% endblock %}
