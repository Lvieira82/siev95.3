{% extends 'base.html' %}

{% block title %}
Solicitar Correção
{% endblock %}

{% block content %}

<style>

.card-correcao{

    max-width:800px;
    margin:40px auto;
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 6px 20px rgba(0,0,0,.08);

}

.card-correcao h2{

    text-align:center;
    margin-bottom:30px;
    color:#111827;

}

.info{

    margin-bottom:25px;
    line-height:2;

}

.info strong{

    color:#111827;

}

textarea{

    width:100%;
    min-height:180px;
    padding:15px;
    border-radius:10px;
    border:1px solid #d1d5db;
    font-size:16px;
    resize:vertical;
    box-sizing:border-box;

}

.botoes{

    margin-top:25px;
    display:flex;
    gap:10px;

}

.btn{

    padding:12px 25px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;

}

.btn-enviar{

    background:#d97706;
    color:white;

}

.btn-voltar{

    background:#6b7280;
    color:white;

}

</style>


<div class="card-correcao">

<h2>Solicitar Correção</h2>

<div class="info">

<strong>Protocolo:</strong>
{{ solicitacao.protocolo }}

<br>

<strong>Evento:</strong>
{{ solicitacao.nome_evento }}

<br>

<strong>Solicitante:</strong>
{{ solicitacao.solicitante }}

</div>

<form method="POST">

{% csrf_token %}

<label>

<strong>Motivo da Correção</strong>

</label>

<textarea
name="motivo_correcao"
required
placeholder="Descreva exatamente o que deve ser corrigido..."></textarea>

<div class="botoes">

<button
type="submit"
class="btn btn-enviar">

Enviar Correção

</button>

<a
href="{% url 'aprovacoes' %}"
class="btn btn-voltar">

Cancelar

</a>

</div>

</form>

</div>

{% endblock %}
